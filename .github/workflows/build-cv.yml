name: Build and Release CV PDFs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/*.tex'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Read version date from sources
        id: version
        run: |
          extract_date() {
            grep -oP '^% Version : \K\d{4}-\d{2}-\d{2}' "$1" || {
              echo "::error file=$1::missing or malformed '% Version : YYYY-MM-DD' comment"
              exit 1
            }
          }
          FR_DATE=$(extract_date src/fr.tex)
          EN_DATE=$(extract_date src/en.tex)

          if [ "$FR_DATE" != "$EN_DATE" ]; then
            echo "::error::version dates differ: fr.tex=$FR_DATE en.tex=$EN_DATE"
            exit 1
          fi
          date -d "$FR_DATE" > /dev/null  # reject impossible dates

          DAY=$((10#${FR_DATE:8:2}))
          case $DAY in
            11|12|13) SUFFIX="th" ;;
            *) case $((DAY % 10)) in
                 1) SUFFIX="st" ;;
                 2) SUFFIX="nd" ;;
                 3) SUFFIX="rd" ;;
                 *) SUFFIX="th" ;;
               esac ;;
          esac
          TITLE="CV - $(date -d "$FR_DATE" +%B) ${DAY}${SUFFIX}, ${FR_DATE:0:4}"

          # same-day releases get -N tags and #N titles; existing releases are never touched
          TAG="$FR_DATE"
          N=1
          while git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; do
            N=$((N+1))
            TAG="$FR_DATE-$N"
          done
          if [ "$N" -gt 1 ]; then
            TITLE="$TITLE #$N"
          fi

          echo "date=$FR_DATE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Compile FR CV to PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: fr.tex
          working_directory: src

      - name: Compile EN CV to PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: en.tex
          working_directory: src

      - name: Prepare release assets
        run: |
          cp src/fr.pdf COTINEAU_Yann_CV_fr.pdf
          cp src/en.pdf COTINEAU_Yann_CV_en.pdf

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.title }}
          body: |
            CV PDFs built from the `${{ steps.version.outputs.date }}` sources.
          make_latest: true
          files: |
            COTINEAU_Yann_CV_fr.pdf
            COTINEAU_Yann_CV_en.pdf
